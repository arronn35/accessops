name: Public E2E

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Keep in sync with "engines" in package.json.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # We only test in Chromium; saves ~80% of the install size.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Public + route-mocked lanes only. The authenticated lane needs
        # staging Firebase credentials (E2E_FIREBASE_* secrets) and is
        # skipped automatically when they are absent.
        run: npm run test:e2e -- --project=marketing --project=ui-mocks
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

      - name: Upload public Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-playwright-report
          path: playwright-report/
          retention-days: 7
